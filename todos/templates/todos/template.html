<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template</title>
</head>
<body>
    {% extends 'todos/base.html' %}
    {% block title %} My Templates {% endblock %}
    {% block content %}
    <h1>{{ name }}</h1>
    <p>Age: {{ age }}</p>
    <p>Skills:</p>
    <ul>
        {% for skill in skills %}
        <li>{{ skill }}</li>
        {% endfor %}
    </ul>
    {% if skills|length > 3%}
    <p>You have many skills!</p>
    {% endif %}
    {% endblock %}
</body>
</html>
