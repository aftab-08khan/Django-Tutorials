<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Information Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .user-form {
            background: #fff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .user-form h2 {
            font-size: 24px;
            color: #222;
            margin-bottom: 8px;
        }

        .user-form p {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .user-form button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .user-form button:hover {
            background: #1d4ed8;
        }

        @media (max-width: 480px) {
            .user-form {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="form-container">
        <form method="post" action="{% url 'post_examples' %}" class="user-form">
            {% csrf_token %}

            <h2>Personal Information</h2>
            <p>Enter your details below.</p>

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" name="age"
                       placeholder="Enter your age" required>
            </div>

            <div class="form-group">
                <label for="job">Job</label>
                <input type="text" id="job" name="job"
                       placeholder="Enter your job title" required>
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>

</body>
</html>
