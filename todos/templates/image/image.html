<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Upload</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            width: 90%;
            max-width: 450px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
            color: #444;
        }

        input[type="file"] {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fafafa;
            width: 100%;
        }

        button {
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Upload Your Image</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <label for="image">Choose an Image</label>

            <input
                type="file"
                name="image"
                id="image"
                accept="image/*"
                required
            >

            <button type="submit">Upload Image</button>
        </form>
    </div>
{%if image_url %}
    <div class="container" style="margin-top: 20px;">
        <h2>Uploaded Image</h2>
        <img src="{{ image_url }}" alt="Uploaded Image" style="width: 100%; border-radius: 12px; margin-top: 15px;">
    </div>
{% endif %}
</body>
</html>
