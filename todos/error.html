
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .error-container {
            background: #fff;
            padding: 45px 35px;
            border-radius: 16px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .error-icon {
            font-size: 55px;
            color: #ef4444;
            margin-bottom: 20px;
        }

        h1 {
            color: #222;
            font-size: 28px;
            margin-bottom: 12px;
        }

        p {
            color: #777;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        a {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
        }

        a:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="error-container">
        <div class="error-icon">⚠</div>
        <h1>Oops! Something went wrong.</h1>
        <p>An error occurred while processing your request. Please try again.</p>
        <a href="javascript:history.back()">Go Back</a>
    </div>

</body>
</html>
